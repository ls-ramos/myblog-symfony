version: '3.8'

services:
  nginx:
    container_name: nginx
    image: nginx:stable-alpine
    ports:
      - '8080:80'
    volumes:
      - .:/var/www/myblog
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php-symfony
      - db-symfony
  
  php-symfony:
    container_name: php-symfony
    build:
      context: ./docker/php-symfony
    ports:
      - '9000:9000'
    volumes:
      - .:/var/www/myblog
      - ./docker/php-symfony/xdebug.ini:/usr/local/etc/php/conf.d/docker-php-ext-xdebug.ini

    depends_on:
      - db-symfony

  db-symfony:
    container_name: db-symfony
    image: mariadb:10.7.3
    ports:
      - '3306:3306'
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE:-myblog}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-ChangeMe}
      MARIADB_USER: ${MARIADB_USER:-symfony}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-ChangeMe}
    volumes:
      - ./docker/mariadb/data:/var/lib/mysql